<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- Outer Speed Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="14" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-dasharray="720" stroke-dashoffset="180" stroke-linecap="round" />

  <!-- Inner Subtle Grid -->
  <circle cx="256" cy="256" r="130" fill="rgba(6, 182, 212, 0.04)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" />
  
  <!-- Speed Lines -->
  <line x1="120" y1="210" x2="190" y2="210" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="90" y1="256" x2="180" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <line x1="130" y1="300" x2="200" y2="300" stroke="#818cf8" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Dynamic Lightning Bolt Symbol -->
  <polygon points="275,95 190,265 260,265 235,415 350,230 280,230" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
